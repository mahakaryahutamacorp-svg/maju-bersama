name: Deploy Laravel to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
      HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
      HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
      HOSTINGER_PATH: ${{ secrets.HOSTINGER_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, pdo_mysql
          coverage: none

      - name: Install Composer dependencies for tests
        run: composer install --prefer-dist --no-interaction

      - name: Run Laravel tests
        run: php artisan test

      - name: Install production Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for var in HOSTINGER_HOST HOSTINGER_PORT HOSTINGER_USER HOSTINGER_PATH; do
            if [ -z "${!var:-}" ]; then
              echo "Missing required secret: $var" >&2
              exit 1
            fi
          done

          test -f artisan
          test -f public/index.php

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Add Hostinger host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${HOSTINGER_PORT:-65002}" "${HOSTINGER_HOST}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git \
              --exclude=.env \
              --exclude=storage/logs \
              --exclude=storage/framework/cache \
              --exclude=storage/framework/sessions \
              --exclude=storage/framework/views \
              -czf /tmp/release.tar.gz .

          scp -P "${HOSTINGER_PORT:-65002}" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            /tmp/release.tar.gz "${HOSTINGER_USER}@${HOSTINGER_HOST}:/tmp/maju-bersama-release.tar.gz"

          ssh -p "${HOSTINGER_PORT:-65002}" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "${HOSTINGER_USER}@${HOSTINGER_HOST}" \
            "mkdir -p '${HOSTINGER_PATH}' && tar -xzf /tmp/maju-bersama-release.tar.gz -C '${HOSTINGER_PATH}' && rm -f /tmp/maju-bersama-release.tar.gz && test -f '${HOSTINGER_PATH}/public/index.php'"

      - name: Run production-safe Laravel optimization
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${HOSTINGER_PORT:-65002}" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "${HOSTINGER_USER}@${HOSTINGER_HOST}" \
            "cd '${HOSTINGER_PATH}' && php artisan about --no-interaction && php artisan optimize --force && php artisan config:cache && php artisan route:cache && php artisan view:cache"
