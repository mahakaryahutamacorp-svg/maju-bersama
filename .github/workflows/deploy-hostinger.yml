name: Deploy Laravel to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, pdo_mysql
          coverage: none

      - name: Install Composer dependencies for tests
        run: composer install --prefer-dist --no-interaction

      - name: Run Laravel tests
        run: php artisan test

      - name: Install production Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Upload release
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PATH: ${{ secrets.HOSTINGER_PATH }}
        run: |
          tar --exclude=.git --exclude=.env --exclude=storage/logs --exclude=storage/framework/cache --exclude=storage/framework/sessions --exclude=storage/framework/views -czf /tmp/release.tar.gz .
          scp -P "${HOSTINGER_PORT:-65002}" -o StrictHostKeyChecking=no /tmp/release.tar.gz "${HOSTINGER_USER}@${HOSTINGER_HOST}:/tmp/maju-bersama-release.tar.gz"
          ssh -p "${HOSTINGER_PORT:-65002}" -o StrictHostKeyChecking=no "${HOSTINGER_USER}@${HOSTINGER_HOST}" "mkdir -p '${HOSTINGER_PATH}' && tar -xzf /tmp/maju-bersama-release.tar.gz -C '${HOSTINGER_PATH}' && rm /tmp/maju-bersama-release.tar.gz"

      - name: Run Laravel deployment commands
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PATH: ${{ secrets.HOSTINGER_PATH }}
        run: |
          ssh -p "${HOSTINGER_PORT:-65002}" -o StrictHostKeyChecking=no "${HOSTINGER_USER}@${HOSTINGER_HOST}" "cd '${HOSTINGER_PATH}' && php artisan migrate --force && php artisan db:seed --class=BranchAccessSeeder --force && php artisan optimize:clear && php artisan config:cache && php artisan route:cache && php artisan view:cache"
